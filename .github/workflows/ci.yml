name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest
      # One traced run: this step gates the suite (exit code is pytest's) and
      # writes the report the coverage step gates without re-running pytest.
      - name: Behavioural suite (single traced run)
        run: python scripts/branch_coverage.py --fail-under 0 --json-out reports/coverage.json
      - name: Skill drift guard
        run: python scripts/skill_drift.py
      - name: Branch coverage (>= 80% per module)
        run: python scripts/branch_coverage.py --evaluate reports/coverage.json --fail-under 80
